[build]
  publish = "website"
  functions = "netlify/functions"

# No build command — pure static site

# Cache static assets aggressively, bust on filename change
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML — always revalidate so content updates are seen immediately
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Pretty URLs — /services instead of /services.html
[[redirects]]
  from = "/services"
  to   = "/services.html"
  status = 200

[[redirects]]
  from = "/gallery"
  to   = "/gallery.html"
  status = 200

[[redirects]]
  from = "/booking"
  to   = "/booking.html"
  status = 200

# Google Ads final URL. The page keeps gclid and other query params, then opens the kitchen booking step.
[[redirects]]
  from = "/kitchen/deep-clean"
  to = "/Kitchen/Deep-Clean"
  status = 301
